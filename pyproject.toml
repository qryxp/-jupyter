[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "da"
version = "0.1.0"
description = "个人网络接单数据分析指标计算 + 图表生成库（技能外包/小微电商/自媒体/零工平台）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "plotly>=5.0",
    "pyecharts>=2.0",
]

[project.urls]
Homepage = "https://github.com/qryxp/-jupyter"
Repository = "https://github.com/qryxp/-jupyter.git"

[tool.setuptools]
packages = [
    "da", "da.core", "da.clean",
    "da.skills", "da.ecommerce", "da.media", "da.gig", "da.charts",
]
